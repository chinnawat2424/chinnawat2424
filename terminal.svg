<svg xmlns="http://www.w3.org/2000/svg" width="1032" height="531" viewBox="0 0 1032 531" role="img" aria-label="Terminal: whoami, profile, projects and deployment">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.018"/>
    </pattern>
    <clipPath id="win"><rect x="16" y="16" width="1000" height="499" rx="14"/></clipPath>
    <style>
      text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, 'DejaVu Sans Mono', monospace; font-size: 15px; white-space: pre; }
      .ttl { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; }
      .ln { opacity: 0; animation: show 0.01s linear forwards; }
      .cur { animation: hide 0.01s linear forwards; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes show { to { opacity: 1; } }
      @keyframes hide { to { opacity: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      .tp1 { animation: tp1 0.27s steps(6) both; } @keyframes tp1 { from { transform: translateX(0); } to { transform: translateX(54.0px); } }
      .tp3 { animation: tp3 0.72s steps(16) both; } @keyframes tp3 { from { transform: translateX(0); } to { transform: translateX(144.0px); } }
      .tp11 { animation: tp11 0.54s steps(12) both; } @keyframes tp11 { from { transform: translateX(0); } to { transform: translateX(108.0px); } }
      .tp13 { animation: tp13 1.26s steps(28) both; } @keyframes tp13 { from { transform: translateX(0); } to { transform: translateX(252.0px); } }
    </style>
  </defs>

