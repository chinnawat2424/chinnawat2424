    <text class="ln" x="44" y="229" style="animation-delay:3.00s" xml:space="preserve"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">"focus"</tspan><tspan fill="#8aa0b8">: </tspan><tspan fill="#8aa0b8">[</tspan><tspan fill="#a7f3d0">"Agentic RAG"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"LLM tool calling"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"ML serving"</tspan><tspan fill="#8aa0b8">]</tspan><tspan fill="#8aa0b8">,</tspan></text>
    <text class="ln" x="44" y="254" style="animation-delay:3.07s" xml:space="preserve"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">"stack"</tspan><tspan fill="#8aa0b8">: </tspan><tspan fill="#8aa0b8">[</tspan><tspan fill="#a7f3d0">"Python"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"PyTorch"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"FastAPI"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"Docker"</tspan><tspan fill="#8aa0b8">, </tspan><tspan fill="#a7f3d0">"Next.js"</tspan><tspan fill="#8aa0b8">]</tspan><tspan fill="#8aa0b8">,</tspan></text>
    <text class="ln" x="44" y="279" style="animation-delay:3.14s" xml:space="preserve"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">"impact"</tspan><tspan fill="#8aa0b8">: </tspan><tspan fill="#a7f3d0">"ONNX INT8 → </tspan><tspan fill="#fbbf24">-73% latency</tspan><tspan fill="#a7f3d0">, </tspan><tspan fill="#fbbf24">-75% model size</tspan><tspan fill="#a7f3d0">"</tspan><tspan fill="#8aa0b8">,</tspan></text>
    <text class="ln" x="44" y="304" style="animation-delay:3.21s" xml:space="preserve"><tspan fill="#e2e8f0">  </tspan><tspan fill="#7dd3fc">"goal"</tspan><tspan fill="#8aa0b8">: </tspan><tspan fill="#a7f3d0">"Forward Deployed Engineer"</tspan><tspan fill="#8aa0b8"></tspan></text>
    <text class="ln" x="44" y="329" style="animation-delay:3.28s" xml:space="preserve"><tspan fill="#8aa0b8">}</tspan></text>
    <g class="ln" style="animation-delay:3.35s"><text x="44" y="364" textLength="153.0" lengthAdjust="spacing"><tspan fill="#5eead4">jay@chinnawat</tspan><tspan fill="#e2e8f0">:</tspan><tspan fill="#7dd3fc">~</tspan><tspan fill="#e2e8f0">$ </tspan></text><text x="197.0" y="364" fill="#e2e8f0" textLength="107.1" lengthAdjust="spacing">ls projects/</text><g class="tp11" style="animation-delay:3.70s"><rect x="197.0" y="347" width="138.0" height="25" fill="#0a1322"/><rect class="cur" x="197.0" y="350" width="9.0" height="18" fill="#5eead4" style="animation-delay:4.29s"/></g></g>
    <text class="ln" x="44" y="389" style="animation-delay:4.49s" xml:space="preserve"><tspan fill="#7dd3fc">agentic-rag-stock-assistant/</tspan><tspan fill="#e2e8f0">   </tspan><tspan fill="#7dd3fc">food-vision-api/</tspan><tspan fill="#e2e8f0">   </tspan><tspan fill="#7dd3fc">mlops-pipeline/</tspan></text>
    <g class="ln" style="animation-delay:4.56s"><text x="44" y="424" textLength="153.0" lengthAdjust="spacing"><tspan fill="#5eead4">jay@chinnawat</tspan><tspan fill="#e2e8f0">:</tspan><tspan fill="#7dd3fc">~</tspan><tspan fill="#e2e8f0">$ </tspan></text><text x="197.0" y="424" fill="#e2e8f0" textLength="251.1" lengthAdjust="spacing">./deploy.sh --env production</text><g class="tp13" style="animation-delay:4.91s"><rect x="197.0" y="407" width="282.0" height="25" fill="#0a1322"/><rect class="cur" x="197.0" y="410" width="9.0" height="18" fill="#5eead4" style="animation-delay:6.22s"/></g></g>
    <text class="ln" x="44" y="449" style="animation-delay:6.42s" xml:space="preserve"><tspan fill="#8aa0b8">[</tspan><tspan fill="#4ade80">✓</tspan><tspan fill="#e2e8f0">] tests passed    </tspan><tspan fill="#8aa0b8">[</tspan><tspan fill="#4ade80">✓</tspan><tspan fill="#e2e8f0">] image built    </tspan><tspan fill="#8aa0b8">[</tspan><tspan fill="#4ade80">✓</tspan><tspan fill="#e2e8f0">] live on Hugging Face Spaces</tspan></text>
    <g class="ln" style="animation-delay:6.79s"><text x="44" y="484" textLength="153.0" lengthAdjust="spacing"><tspan fill="#5eead4">jay@chinnawat</tspan><tspan fill="#e2e8f0">:</tspan><tspan fill="#7dd3fc">~</tspan><tspan fill="#e2e8f0">$ </tspan></text><rect class="blink" x="197.0" y="470" width="9.0" height="18" fill="#5eead4"/></g>
    <rect x="16" y="60" width="1000" height="455" fill="url(#scan)"/>
    <rect x="16" y="60" width="600" height="1.5" fill="url(#edge)">
