<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Chinnawat Thongsuwan, AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset="0.55" stop-color="#0c2233"/>
      <stop offset="1" stop-color="#0f4554"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
      <animateTransform attributeName="patternTransform" type="translate" values="0 0;28 28" dur="8s" repeatCount="indefinite"/>
    </pattern>

    <!-- shimmer sweeping across the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-420" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#7cf5e3"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1420 0;1420 0" keyTimes="0;0.4;1" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- bottom light line -->
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-600 0;1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- name reveal wipe -->
    <clipPath id="reveal">
      <rect x="60" y="96" width="900" height="84">
        <animate attributeName="width" values="0;0;900" keyTimes="0;0.25;1" dur="1.5s" calcMode="spline" keySplines="0 0 1 1;0.22 1 0.36 1" fill="freeze"/>
      </rect>
    </clipPath>

    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>

    <!-- signal routes through the network -->
    <path id="r1" d="M880 90 L990 60 L1100 110"/>
    <path id="r2" d="M880 160 L990 160 L1100 210"/>
    <path id="r3" d="M880 230 L990 260 L1100 210"/>
    <path id="r4" d="M880 90 L990 160 L1100 110"/>
    <path id="r5" d="M880 230 L990 160 L1100 110"/>
    <path id="r6" d="M880 160 L990 60 L1100 110"/>

    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .m { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .in { animation: rise 0.9s cubic-bezier(.22,1,.36,1) both; }
      .d1 { animation-delay: 0.1s; }
      .d4 { animation-delay: 1.4s; }
      .cy { opacity: 0; animation: cycle 9s ease-in-out infinite; }
      .c1 { animation-delay: 1.2s; }
      .c2 { animation-delay: 4.2s; }
      .c3 { animation-delay: 7.2s; }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      .flow { stroke-dasharray: 5 9; animation: flow 4s linear infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes cycle {
        0%   { opacity: 0; transform: translateY(12px); }
        5%   { opacity: 1; transform: translateY(0); }
        29%  { opacity: 1; transform: translateY(0); }
        34%  { opacity: 0; transform: translateY(-12px); }
        100% { opacity: 0; transform: translateY(-12px); }
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes flow { to { stroke-dashoffset: -112; } }
      @media (prefers-reduced-motion: reduce) {
        .in, .blink, .flow { animation: none; }
        .cy { animation: none; }
        .c1 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <!-- background -->
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="980" cy="150" r="330" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 25;20 -20;0 0" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="330" r="320" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;90 -30;30 10;0 0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- network edges -->
    <g stroke="#5eead4" stroke-opacity="0.16" stroke-width="1.2">
      <path d="M880 90 L990 60 M880 90 L990 160 M880 90 L990 260 M880 160 L990 60 M880 160 L990 160 M880 160 L990 260 M880 230 L990 60 M880 230 L990 160 M880 230 L990 260"/>
      <path d="M990 60 L1100 110 M990 60 L1100 210 M990 160 L1100 110 M990 160 L1100 210 M990 260 L1100 110 M990 260 L1100 210"/>
    </g>
    <g stroke="#5eead4" stroke-opacity="0.45" stroke-width="1.5" fill="none" class="flow">
      <path d="M880 90 L990 60 L1100 110 M880 160 L990 160 L1100 210 M880 230 L990 260 L1100 210"/>
    </g>

    <!-- ping rings -->
    <g fill="none" stroke="#5eead4" stroke-width="1.5">
      <circle cx="1100" cy="110" r="13"><animate attributeName="r" values="13;32" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="210" r="13"><animate attributeName="r" values="13;32" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.01;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="990" cy="160" r="11"><animate attributeName="r" values="11;26" dur="3s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.01;1" dur="3s" begin="0.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- nodes -->
    <g fill="#0c2233" stroke="#5eead4" stroke-width="2">
      <circle cx="880" cy="90" r="9"/>
      <circle cx="880" cy="160" r="9"/>
      <circle cx="880" cy="230" r="9"/>
      <circle cx="990" cy="60" r="11"/>
      <circle cx="990" cy="160" r="11"/>
      <circle cx="990" cy="260" r="11"/>
      <circle cx="1100" cy="110" r="13"/>
      <circle cx="1100" cy="210" r="13"/>
    </g>
    <circle cx="1100" cy="110" r="4.5" fill="#5eead4" class="blink"/>
    <circle cx="1100" cy="210" r="4.5" fill="#5eead4" class="blink" style="animation-delay:.8s"/>

    <!-- signals travelling through the network -->
    <g fill="#a7f3d0" filter="url(#glow)">
      <circle r="3.5" opacity="0"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite"><mpath href="#r1" xlink:href="#r1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="2.6s" begin="0.5s" repeatCount="indefinite"><mpath href="#r2" xlink:href="#r2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle r="3.5" opacity="0"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#r3" xlink:href="#r3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle r="3" opacity="0"><animateMotion dur="2.8s" begin="1.5s" repeatCount="indefinite"><mpath href="#r4" xlink:href="#r4"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle r="3" opacity="0"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite"><mpath href="#r5" xlink:href="#r5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="3s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle r="3" opacity="0"><animateMotion dur="2.5s" begin="2s" repeatCount="indefinite"><mpath href="#r6" xlink:href="#r6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.5s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- eyebrow -->
    <g class="in">
      <circle cx="78" cy="74" r="5" fill="#5eead4" class="blink"/>
      <text x="94" y="80" class="m" font-size="17" letter-spacing="4" fill="#5eead4">AI ENGINEER</text>
    </g>
    <rect x="72" y="94" width="48" height="3" rx="1.5" fill="#5eead4">
      <animate attributeName="width" values="0;0;48" keyTimes="0;0.4;1" dur="1.2s" fill="freeze"/>
    </rect>

    <!-- name: wipe reveal + shimmer -->
    <text x="70" y="162" class="t" font-size="60" font-weight="700" fill="url(#shine)" clip-path="url(#reveal)">Chinnawat Thongsuwan</text>

    <!-- rotating focus areas -->
    <g class="t" font-size="23" fill="#cbd5e1">
      <text x="72" y="210" class="cy c1"><tspan fill="#5eead4">›</tspan>  Building agentic RAG systems on LLMs</text>
      <text x="72" y="210" class="cy c2"><tspan fill="#5eead4">›</tspan>  Optimizing models with ONNX &amp; INT8 quantization</text>
      <text x="72" y="210" class="cy c3"><tspan fill="#5eead4">›</tspan>  Shipping ML to production with Docker &amp; CI/CD</text>
    </g>

    <text x="72" y="262" class="m in d4" font-size="15" fill="#8aa0b8">B.Eng. AI Engineering &amp; Data Science  —  Bangkok, Thailand</text>

    <!-- bottom light line -->
    <rect x="0" y="317" width="1200" height="3" fill="url(#line)"/>
  </g>
</svg>
