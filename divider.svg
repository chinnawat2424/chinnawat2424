<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="-220" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a7f3d0" stop-opacity="1"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1220 0" dur="3.2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="13.25" width="1000" height="1.5" fill="url(#base)"/>
  <rect x="0" y="12.5" width="1000" height="3" fill="url(#pulse)" filter="url(#glow)"/>

  <g fill="#0b1220" stroke="#5eead4" stroke-width="1.5">
    <rect x="493" y="7" width="14" height="14" transform="rotate(45 500 14)">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="462" cy="14" r="3"/>
    <circle cx="538" cy="14" r="3"/>
  </g>
  <circle cx="500" cy="14" r="2.5" fill="#5eead4">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
